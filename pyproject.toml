[project]
name = "survey-system"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.15,<2",
    "asyncmy>=0.2.11,<0.3",
    "asyncpg>=0.31,<0.32",
    "fastapi>=0.115,<1",
    "orjson>=3.10,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pyrefly>=1,<2",
    "pytest>=9,<10",
    "ruff>=0.12,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["F401", "F403", "F405"]

[tool.pyrefly]
baseline = ".pyrefly-baseline.json"
project-includes = ["src", "tests"]
python-version = "3.14"
search-path = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "-ra"]
